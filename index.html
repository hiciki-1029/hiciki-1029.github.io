<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="熙熙的个人主页">
  <title>嘻嘻是熙熙</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f1e8;
      color: #25231f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, #fff7d6 0, transparent 32%),
        radial-gradient(circle at 80% 75%, #dbe9df 0, transparent 34%),
        #f5f1e8;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(36px, 8vw, 72px);
      border: 1px solid rgba(37, 35, 31, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 80px rgba(37, 35, 31, 0.08);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: #63756a;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 76px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    p:last-child {
      margin: 24px 0 0;
      color: #666158;
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Hi, I'm Xixi</p>
    <h1>嘻嘻是熙熙。</h1>
    <p>这里是我的个人主页，正在慢慢搭建中。</p>
  </main>
</body>
</html>
