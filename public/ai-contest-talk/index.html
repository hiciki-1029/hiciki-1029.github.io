<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Ciki · 私密分享</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f2eb;color:#254333;font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}main{width:min(440px,100%);padding:42px 36px;border:1px solid #d7ddcf;background:#fbfbf5;border-radius:12px;box-shadow:0 18px 60px #2543330c}.mark{font:bold 40px Georgia;color:#bc663f}h1{font-size:28px;font-weight:550;margin:28px 0 14px}p{font-size:14px;line-height:1.8;color:#687264}label{display:block;font-size:13px;margin:28px 0 10px}input{width:100%;padding:14px;border:1px solid #b5c0ac;border-radius:6px;font-size:16px;background:white}button{width:100%;padding:15px;margin-top:16px;border:0;border-radius:6px;background:#294b39;color:white;font-size:15px;cursor:pointer}button:disabled{opacity:.6}#status{min-height:26px;margin-bottom:0}small{display:block;margin-top:28px;color:#7b8376;font-size:12px}</style></head><body><main><div class="mark">c.</div><h1>这是一份私密分享</h1><p>请输入分享者提供的访问密码，打开演示。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">解锁演示 →</button><p id="status" role="status" aria-live="polite"></p></form><small>刷新或关闭页面后，需要重新输入密码。</small></main><script src="unlock.js"></script></body></html>
